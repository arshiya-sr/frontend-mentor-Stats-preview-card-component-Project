<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Stats preview card component</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <main class="main">

    <article class="card">

      <section class="card-image">
        <img class="img mobile" src="./images/image-header-mobile.jpg" alt="" aria-hidden="true">
        <img class="img desktop" src="./images/image-header-desktop.jpg" alt="" aria-hidden="true">
        <div class="overlay"></div>
      </section>

      <section class="card-body">
        <h1 class="card-title">
          Get <strong class="marked">insights</strong> that help your business grow.
        </h1>
        <p class="card-text">
          Discover the benefits of data analytics and make better decisions regarding revenue,
          customer
          experience, and overall efficiency.
        </p>
        <div class="stats">
          <div class="stat">
            <p class="number">10k+</p>
            <p class="label">companies</p>
          </div>
          <div class="stat">
            <p class="number">314</p>
            <p class="label">templates</p>
          </div>
          <div class="stat">
            <p class="number">12m+</p>
            <p class="label">queries</p>
          </div>
        </div>
      </section>

    </article>

  </main>

  <footer class="footer">
    <p>Challenge by <a class="credit" rel="noopener noreferrer" target="_blank"
        href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.</p>
    <p>Coded by <a class="credit" rel="noopener noreferrer" target="_blank"
        href="https://github.com/arshiya-sr">Arshiya_sr</a>.</p>
  </footer>
</body>

</html>
